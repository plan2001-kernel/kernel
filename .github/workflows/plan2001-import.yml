name: Import verified Plan2001-O T12 source
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/chunks/**'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'plan2001-kernel/kernel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify, unpack and apply T12
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib, tarfile, os
          expected = '524417426c965e0a57655ece6a0c3fbcd9cac98f299a055b85828cba6ffb2b0d'
          expected_patch = 'f644fc8aa0ec81f8a6a0d5c8bbf0f8948597bd9106bfc3f258b38685d327edd9'
          parts = sorted(pathlib.Path('bootstrap/chunks').glob('*.b64'))
          assert len(parts) == 251, ('chunk count',len(parts))
          archive = b''.join(base64.b64decode(p.read_text().strip(), validate=True) for p in parts)
          assert len(archive) == 2052166, len(archive)
          assert hashlib.sha256(archive).hexdigest() == expected
          patch = pathlib.Path('bootstrap/T12-finished.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == expected_patch
          pathlib.Path('/tmp/plan2001-t12.patch').write_bytes(patch)
          target = pathlib.Path.cwd().resolve()
          with tarfile.open(fileobj=__import__('io').BytesIO(archive), mode='r:gz') as tf:
              ms = [m for m in tf.getmembers() if m.isfile()]
              assert len(ms) == 876, len(ms)
              paths = [pathlib.PurePosixPath(m.name) for m in ms]
              strip = 0
              if not any(str(p)=='AGENTS.md' for p in paths):
                  first = {p.parts[0] for p in paths}
                  assert len(first)==1 and any(len(p.parts)>1 and p.parts[1]=='AGENTS.md' for p in paths)
                  strip=1
              seen=set()
              for m,p in zip(ms,paths):
                  bits=p.parts[strip:]
                  assert bits and '..' not in bits and not p.is_absolute()
                  rel=pathlib.Path(*bits)
                  assert str(rel) not in seen and not str(rel).startswith('bootstrap/')
                  seen.add(str(rel))
                  out=(target/rel).resolve()
                  assert out.is_relative_to(target) and not out.is_symlink()
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(tf.extractfile(m).read())
                  os.chmod(out,m.mode & 0o777)
          print('Verified source:',len(seen),'files; archive SHA-256:',expected)
          PY
          git apply --check /tmp/plan2001-t12.patch
          git apply /tmp/plan2001-t12.patch
          test -f docs/DEVICE-ABI.md
          test -f tools/host/t12/device-checks.py
          test -f kernel/core/sysvobj.c
          rm -rf bootstrap .github/workflows/plan2001-import.yml
          git config user.name "Plan2001-O import"
          git config user.email "plan2001-kernel@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Plan2001-O T11 source with T12 finished patch"
          git push origin HEAD:main
