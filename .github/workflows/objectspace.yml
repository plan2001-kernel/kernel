name: ObjectSpace v1
on:
  pull_request:
    paths:
      - 'kernel/**'
      - 'runtime/**'
      - 'micropython/**'
      - 'tools/host/objectspace/**'
      - 'docs/OBJECTSPACE.md'
      - '.github/workflows/objectspace.yml'
  workflow_dispatch:

jobs:
  amd64-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-14 binutils clang lld file mtools ovmf qemu-system-x86 python3
      - name: Validate ABI and wiring (static)
        run: python3 tools/host/objectspace/contract-check.py
      - name: Reject legacy SpaceID and named storage boundaries
        run: python3 tools/host/objectspace/flat-volume-check.py
      - name: Build AMD64 kernel
        run: CC=gcc-14 tools/build-gcc.sh --kernel -j 4
      - name: Build UEFI loader
        run: tools/build-efi-gcc.sh -j 4
      - name: Build MicroPython
        run: CC=gcc-14 tools/build-mpy-gcc.sh -j 4
      - name: Build GE host volume tools
        run: tools/build.sh
      - name: QEMU ObjectSpace graph acceptance
        run: tools/host/objectspace/run-objectspace.sh --no-build
      - name: QEMU durable ObjectSpace reboot and crash recovery
        run: bash tools/host/objectspace/run-persistent.sh --no-build
      - name: Upload QEMU diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: objectspace-qemu-logs
          path: |
            build/objectspace/run/
            build/objectspace/persistent/
          if-no-files-found: ignore
